<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITALS — preloader</title>
<style>
  @font-face{
    font-family:"Basis Grotesque";
    src:url("/fonts/BasisGrotesqueArabicPro-Light.woff2") format("woff2");
    font-weight:300; font-display:block;
  }
  :root{
    --bg:#2b3530;      /* Elementis dark green */
    --fg:#d1ccbf;      /* bone */
    --ease:cubic-bezier(.16,1,.3,1);   /* ~ gsap power4.out */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Basis Grotesque",-apple-system,"Segoe UI",sans-serif;
    font-weight:300; overflow:hidden;
    display:grid; place-items:center;
  }

  /* ---------- the curtain ---------- */
  .preloader{
    position:fixed; inset:0; background:var(--bg);
    display:grid; place-items:center; z-index:10;
    transform:translateY(0);
  }
  .preloader.lift{
    transform:translateY(-100%);
    transition:transform 1.1s var(--ease);
  }

  .mark{ width:min(64vw,500px); overflow:visible }

  /* letters start low + invisible; JS adds .in */
  .ltr{
    opacity:0;
    transform:translateY(26px);
    transition:opacity .9s var(--ease), transform .9s var(--ease);
  }
  .ltr.in{ opacity:1; transform:translateY(0) }

  /* the ECG trace */
  #trace{
    fill:none; stroke:var(--fg); stroke-width:2.5;
    stroke-linecap:round; stroke-linejoin:round;
    opacity:.85;
  }
  #trace.fade{ opacity:0; transition:opacity .7s ease }

  /* the I that the spike settles into */
  #eye{
    opacity:0; transform-box:fill-box; transform-origin:50% 100%;
    transform:scaleY(.4);
  }
  #eye.in{
    opacity:1; transform:scaleY(1);
    transition:opacity .45s ease, transform .6s var(--ease);
  }

  /* whole lockup drifts up as it goes */
  .mark.out{
    opacity:0; transform:translateY(-14px) scale(.985);
    transition:opacity .8s ease, transform .9s var(--ease);
  }

  /* ---------- what's underneath ---------- */
  .page{ text-align:center; padding:2rem }
  .page h1{ font-size:clamp(2rem,7vw,4.5rem); letter-spacing:.34em; text-indent:.34em }
  .page p{ margin-top:1.4rem; opacity:.55; letter-spacing:.12em; font-size:.82rem; text-transform:uppercase }

  .replay{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
    z-index:20; border:1px solid rgba(209,204,191,.3); color:var(--fg);
    background:none; padding:11px 22px; border-radius:999px; cursor:pointer;
    font:inherit; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase;
    transition:background .3s ease, border-color .3s ease;
  }
  .replay:hover{ background:rgba(209,204,191,.09); border-color:rgba(209,204,191,.6) }

  @media (prefers-reduced-motion:reduce){
    .ltr,.ltr.in,#eye,#eye.in{transition:none;opacity:1;transform:none}
    .preloader.lift{transition:none}
  }
</style>
</head>
<body>

  <div class="page">
    <h1>VITALS</h1>
    <p>Multiple disease screening</p>
  </div>

  <div class="preloader" id="pre">
    <!-- letters sit on baseline y=110. the I slot (x=170) is left empty
         until the ECG spike settles into it. -->
    <svg class="mark" id="mark" viewBox="0 0 580 176" aria-label="VITALS">
      <g fill="var(--fg)" font-family="Basis Grotesque,sans-serif"
         font-size="64" font-weight="300" text-anchor="middle"
         letter-spacing="0">
        <text class="ltr" x="90"  y="110">V</text>
        <text class="ltr" x="250" y="110">T</text>
        <text class="ltr" x="330" y="110">A</text>
        <text class="ltr" x="410" y="110">L</text>
        <text class="ltr" x="490" y="110">S</text>
        <!-- the I: revealed only after the spike lands -->
        <text id="eye" x="170" y="110">I</text>
      </g>

      <!-- The trace runs on its own baseline (y=136), clear of the letter
           baseline (y=110), so it reads as a readout under the word rather
           than an underline touching it. The spike still rises to the I's
           cap height (y=66) so it lands on the glyph it becomes. -->
      <path id="trace" d="
        M 8 136
        L 108 136
        q 8 0 12 -7 q 4 7 12 7
        L 156 136
        L 164 136
        L 170 66
        L 176 154
        L 182 136
        L 300 136
        q 10 0 16 -9 q 6 9 16 9
        L 572 136" />
    </svg>
  </div>

  <button class="replay" id="replay">Replay</button>

<script>
(function(){
  var pre    = document.getElementById('pre');
  var mark   = document.getElementById('mark');
  var trace  = document.getElementById('trace');
  var eye    = document.getElementById('eye');
  var ltrs   = Array.prototype.slice.call(document.querySelectorAll('.ltr'));
  var timers = [];

  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clear(){ timers.forEach(clearTimeout); timers = []; }

  function run(){
    clear();

    // reset
    pre.classList.remove('lift');
    mark.classList.remove('out');
    trace.classList.remove('fade');
    eye.classList.remove('in');
    ltrs.forEach(function(l){ l.classList.remove('in'); });

    // prime the trace for a draw-on
    var len = trace.getTotalLength();
    trace.style.transition = 'none';
    trace.style.strokeDasharray  = len;
    trace.style.strokeDashoffset = len;
    void trace.getBoundingClientRect();   // force reflow

    // 1. letters rise in, 100ms apart  (V T A L S — I is absent)
    ltrs.forEach(function(l, i){
      at(200 + i * 100, function(){ l.classList.add('in'); });
    });

    // 2. ECG draws left→right across the baseline
    at(900, function(){
      trace.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1)';
      trace.style.strokeDashoffset = 0;
    });

    // 3. the spike settles into the letter I, trace dissolves
    at(2150, function(){ eye.classList.add('in'); });
    at(2320, function(){ trace.classList.add('fade'); });

    // 4. hold, then lift the curtain
    at(3250, function(){ mark.classList.add('out'); });
    at(3600, function(){ pre.classList.add('lift'); });
  }

  document.getElementById('replay').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
